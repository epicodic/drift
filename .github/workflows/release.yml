name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-package
      - name: Attach package to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" drift_*.kwinscript --clobber
